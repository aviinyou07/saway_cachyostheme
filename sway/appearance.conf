# ==============================================================================
# CYBER NOIR // WINDOW APPEARANCE, GAPS & GEOMETRIC STYLING
# ==============================================================================
# Strict visual guidelines: rounded corners, glassmorphism, thin borders, soft shadows.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BORDERS & DECORATIONS
# ------------------------------------------------------------------------------
# Minimal 1px border around tiling and floating dev windows (no bulky title bars)
default_border pixel 1
default_floating_border pixel 1

# With outer gaps, windows never touch the screen edge, so `smart` here only
# duplicates what `smart_borders on` below already does. `smart_no_gaps` is the
# variant that actually means something in a gapped layout.
hide_edge_borders --i3 smart_no_gaps

# ------------------------------------------------------------------------------
# 2. SPATIAL GAP DISTANCES
# ------------------------------------------------------------------------------
# Inner gaps (padding between adjacent application tiles)
gaps inner 6

# Outer gaps (margin between windows and screen perimeters / Waybar)
gaps outer 10

# Automatically collapse gaps when a single container occupies the entire display
smart_gaps on
smart_borders on

# ------------------------------------------------------------------------------
# 3. SWAYFX VISUAL EFFECTS (conditional)
# ------------------------------------------------------------------------------
# Rounded corners, blur and shadows are SwayFX-only directives -- on upstream
# sway they are hard config errors, which is why they cannot be written here
# directly. The script probes the running compositor and applies them only when
# they are actually supported, so this one config works on sway AND swayfx.
#
# On upstream sway it is a no-op. Install `swayfx` to get the rounded,
# glassmorphic look the README describes.
exec_always ~/.config/sway/scripts/swayfx-effects.sh
