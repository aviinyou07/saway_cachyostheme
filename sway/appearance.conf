# ==============================================================================
# CYBER NOIR // WINDOW APPEARANCE, GAPS & GEOMETRIC STYLING
# ==============================================================================
# Strict visual guidelines: rounded corners, glassmorphism, thin borders, soft shadows.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. BORDERS & DECORATIONS
# ------------------------------------------------------------------------------
# Minimal 1px border around tiling and floating dev windows (no bulky title bars)
default_border pixel 1
default_floating_border pixel 1

# With outer gaps, windows never touch the screen edge, so `smart` here only
# duplicates what `smart_borders on` below already does. `smart_no_gaps` is the
# variant that actually means something in a gapped layout.
hide_edge_borders --i3 smart_no_gaps

# ------------------------------------------------------------------------------
# 2. SPATIAL GAP DISTANCES
# ------------------------------------------------------------------------------
# Inner gaps (padding between adjacent application tiles)
gaps inner 6

# Outer gaps (margin between windows and screen perimeters / Waybar)
gaps outer 10

# Automatically collapse gaps when a single container occupies the entire display
smart_gaps on
smart_borders on

# ------------------------------------------------------------------------------
# 3. NO ROUNDED CORNERS, BLUR OR SHADOWS -- AND WHY
# ------------------------------------------------------------------------------
# corner_radius, blur and shadows are SwayFX directives. On upstream sway they
# are hard config errors, so they cannot simply be added here.
#
# SwayFX is not an option on this system either: sway 1.12 is built against
# wlroots0.20, swayfx 0.6 still requires wlroots0.19, and that package has been
# dropped from the Arch/CachyOS repositories --
#     :: unable to satisfy dependency 'wlroots0.19' required by swayfx
#
# A conditional effects script used to sit here, probing the compositor and
# no-opping on upstream sway. It was removed rather than left as scaffolding for
# something that cannot currently be installed: a reload that always does
# nothing is just a thing to wonder about later.
#
# The translucency in the Waybar and Mako styling is plain alpha compositing
# over the wallpaper, not real blur, and reads fine without it.
