# ==============================================================================
# CYBER NOIR // WINDOW RULES & APPLICATION BEHAVIOR POLICY
# ==============================================================================
# Controls floating behavior, window size constraints, and workspace assignments.
# Identify application app_id or class using `swaymsg -t get_tree`.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. SMART FLOATING DIALOGS & UTILITY WINDOWS
# ------------------------------------------------------------------------------
# Auto-float PulseAudio / PipeWire audio mixer daemons & connectivity managers
for_window [app_id="pavucontrol"] floating enable, resize set 650 550, move scratchpad
for_window [app_id="nm-connection-editor"] floating enable, resize set 600 500
for_window [app_id="floating_nmtui"] floating enable, resize set 650 500
for_window [app_id="blueman-manager"] floating enable, resize set 600 550
for_window [app_id="nwg-look"] floating enable, resize set 700 600
for_window [app_id="nwg-displays"] floating enable, resize set 800 600
for_window [app_id="org.gnome.Nautilus" title="^File Operation Progress"] floating enable

# Authentication prompt dialogs and security gateways
for_window [app_id="lxtsudo"] floating enable
for_window [app_id="gcr-prompter"] floating enable
for_window [title=".*Authentication Required.*"] floating enable
for_window [class="Pinentry"] floating enable, urgent enable
for_window [app_id="polkit-gnome-authentication-agent-1"] floating enable, urgent enable
for_window [app_id="org.kde.polkit-kde-authentication-agent-1"] floating enable, urgent enable

# Common dialog window typologies (File Open / Save, Preferences)
for_window [window_role="pop-up"] floating enable
for_window [window_role="bubble"] floating enable
for_window [window_role="dialog"] floating enable
for_window [window_role="task_dialog"] floating enable
for_window [window_role="About"] floating enable
for_window [title="^Open File$"] floating enable, resize set 800 600
for_window [title="^Save File$"] floating enable, resize set 800 600
for_window [title="^Choose Files$"] floating enable, resize set 800 600

# Picture-in-Picture & Media overlays (Firefox / Chromium)
for_window [title="^Picture-in-Picture$"] floating enable, sticky enable, border pixel 1, resize set 450 260

# ------------------------------------------------------------------------------
# 2. WORKSPACE ASSIGNMENTS — INTENTIONALLY DISABLED
# ------------------------------------------------------------------------------
# Apps open on whichever workspace is currently active.
# No forced jumps, no surprise workspace numbers.
# Move windows manually with: Super + Shift + [1-9]
# ------------------------------------------------------------------------------


# ------------------------------------------------------------------------------
# 3. SPECIAL BEHAVIORS & INHIBITION
# ------------------------------------------------------------------------------
# Prevent media players and full screen presentation tools from locking monitors
for_window [class="^.*"] inhibit_idle fullscreen
for_window [app_id="mpv"] inhibit_idle open
for_window [app_id="firefox"] inhibit_idle fullscreen
