# ==============================================================================
# CYBER NOIR // ERGONOMIC SYSTEM KEYBINDINGS & VIM NAVIGATION
# ==============================================================================
# All shortcuts utilize Mod4 ($mod = Super/Windows key).
# Vim direction convention: h (left), j (down), k (up), l (right).
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. APPLICATION LAUNCHING & SYSTEM CONTROLS
# ------------------------------------------------------------------------------
# Start primary terminal emulator with automatic fallback support
bindsym $mod+Return exec $term
bindsym $mod+KP_Enter exec $term
bindsym $mod+t exec $term
bindsym $mod+Shift+t exec kitty --session ~/.config/kitty/smart_session.conf

# Launch Application menu & run prompt (Wofi)
bindsym $mod+d exec $menu
bindsym $mod+space exec $menu

# Clipboard History Picker
# Both clipboard-history keys run the identical pipeline, so it is defined once.
# $mod+y was previously declared over in autostart.conf with its own near-copy of
# this command, which is how the two drifted to different prompt strings.
set $clipmenu cliphist list | wofi --dmenu --conf ~/.config/wofi/dmenu.conf --style ~/.config/wofi/style.css -p 'Clipboard' | cliphist decode | wl-copy
bindsym $mod+Shift+v exec $clipmenu
bindsym $mod+y       exec $clipmenu

# Interactive Cyber Noir Wallpaper Switcher & Theme Selector
bindsym $mod+Shift+w exec ~/.config/sway/scripts/wallpaper-switch.sh menu
bindsym $mod+Alt+w exec ~/.config/sway/scripts/wallpaper-switch.sh -n

# Close focused window immediately
bindsym $mod+Shift+q kill

# Lock workstation display immediately (Swaylock)
bindsym $mod+Ctrl+l exec $lock
bindsym $mod+Alt+l exec $lock

# Reload Sway configuration dynamically without restarting Wayland server
bindsym $mod+Shift+c reload

# Exit Sway completely (with verification prompt via wofi/bash or standard fallback)
bindsym $mod+Shift+e exec swaynag -t warning -m 'Terminate Sway & End Wayland Session?' -b 'Confirm Logout' 'swaymsg exit'

# ------------------------------------------------------------------------------
# 2. ADVANCED SCREENSHOT ENGINEERING (grim + slurp + wl-clipboard)
# ------------------------------------------------------------------------------
# All three live in one script. Inline, two of them ran their capture tool twice
# -- $mod+Print made you select the region a second time just to fill the
# clipboard, and Print took two separate full-screen grabs. See the script.
bindsym Print        exec ~/.config/sway/scripts/screenshot.sh full
bindsym $mod+Print   exec ~/.config/sway/scripts/screenshot.sh region
bindsym $mod+Shift+s exec ~/.config/sway/scripts/screenshot.sh copy

# ------------------------------------------------------------------------------
# 3. CONTAINER FOCUS & VIM SPATIAL NAVIGATION
# ------------------------------------------------------------------------------
# Navigate active window focus with Vi motion keys
bindsym $mod+h focus left
bindsym $mod+j focus down
bindsym $mod+k focus up
bindsym $mod+l focus right

# Standard directional arrows fallback
bindsym $mod+Left focus left
bindsym $mod+Down focus down
bindsym $mod+Up focus up
bindsym $mod+Right focus right

# Move containers spatially across workspace grid
bindsym $mod+Shift+h move left
bindsym $mod+Shift+j move down
bindsym $mod+Shift+k move up
bindsym $mod+Shift+l move right

bindsym $mod+Shift+Left move left
bindsym $mod+Shift+Down move down
bindsym $mod+Shift+Up move up
bindsym $mod+Shift+Right move right

# ------------------------------------------------------------------------------
# 4. WORKSPACE MANAGEMENT (1-10)
# ------------------------------------------------------------------------------
# Switch focus to target workspace
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+4 workspace number 4
bindsym $mod+5 workspace number 5
bindsym $mod+6 workspace number 6
bindsym $mod+7 workspace number 7
bindsym $mod+8 workspace number 8
bindsym $mod+9 workspace number 9
bindsym $mod+0 workspace number 10

# Move active application container directly to target workspace
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bindsym $mod+Shift+4 move container to workspace number 4
bindsym $mod+Shift+5 move container to workspace number 5
bindsym $mod+Shift+6 move container to workspace number 6
bindsym $mod+Shift+7 move container to workspace number 7
bindsym $mod+Shift+8 move container to workspace number 8
bindsym $mod+Shift+9 move container to workspace number 9
bindsym $mod+Shift+0 move container to workspace number 10

# Seamless cycling through existing active workspaces
bindsym $mod+Tab workspace next_on_output
bindsym $mod+Shift+Tab workspace prev_on_output
bindsym $mod+Ctrl+Right workspace next
bindsym $mod+Ctrl+Left workspace prev

# ------------------------------------------------------------------------------
# 5. LAYOUT ARCHITECTURE & FLOATING CONTROL
# ------------------------------------------------------------------------------
# Container splitting orientation
bindsym $mod+b splith
bindsym $mod+v splitv

# Switch structural container layout
bindsym $mod+s layout stacking
bindsym $mod+w layout tabbed
bindsym $mod+e layout toggle split
bindsym $mod+f fullscreen toggle

# Toggle window floating state & cycling focus between tiled/floating windows
bindsym $mod+Shift+space floating toggle
bindsym $mod+Alt+space focus mode_toggle

# Scratchpad container staging (minimize utilities to hidden workspace layer)
bindsym $mod+Shift+minus move scratchpad
bindsym $mod+minus scratchpad show

# Enter Resizing Mode
mode "resize" {
    bindsym h resize shrink width 10px
    bindsym j resize grow height 10px
    bindsym k resize shrink height 10px
    bindsym l resize grow width 10px

    bindsym Left resize shrink width 10px
    bindsym Down resize grow height 10px
    bindsym Up resize shrink height 10px
    bindsym Right resize grow width 10px

    bindsym Return mode "default"
    bindsym Escape mode "default"
    bindsym $mod+r mode "default"
}
bindsym $mod+r mode "resize"

# ------------------------------------------------------------------------------
# 6. HARDWARE & MULTIMEDIA FUNCTION KEYS (PulseAudio / PipeWire & Display)
# ------------------------------------------------------------------------------
# Audio Volume Controller (wpctl / Pipewire standard on CachyOS)
bindsym --locked XF86AudioRaiseVolume exec wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86AudioMicMute exec wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Display Backlight Brightness Controllers (brightnessctl)
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86Display exec ~/.config/sway/scripts/display-settings.sh

# ------------------------------------------------------------------------------
# 6b. POWER / SLEEP HARDWARE KEYS
# ------------------------------------------------------------------------------
# The power button used to shut the machine down instantly with no prompt. That
# was NOT a sway behaviour -- nothing was bound here, so the key fell through to
# systemd-logind, whose default is HandlePowerKey=poweroff.
#
# Fixing it takes BOTH halves:
#   * logind must be told to keep its hands off the key. See
#     /etc/systemd/logind.conf.d/90-cyber-noir-power.conf (HandlePowerKey=ignore,
#     with HandlePowerKeyLongPress=poweroff kept as a hardware escape hatch).
#   * sway must actually bind it -- below.
#
# Holding the button for ~5s (systemd's long-press threshold) still forces a
# poweroff, so a wedged session is
# always recoverable without the menu.
bindsym --locked XF86PowerOff exec ~/.config/waybar/scripts/power_menu.sh
bindsym --locked XF86PowerDown exec ~/.config/waybar/scripts/power_menu.sh

# Dedicated sleep key suspends directly; swayidle's before-sleep hook locks.
bindsym --locked XF86Sleep exec systemctl suspend
bindsym --locked XF86Suspend exec systemctl suspend

# Keyboard equivalent for machines with no power key at all.
bindsym $mod+Shift+p exec ~/.config/waybar/scripts/power_menu.sh

# Media Playback Controls
bindsym --locked XF86AudioPlay exec playerctl play-pause
bindsym --locked XF86AudioNext exec playerctl next
bindsym --locked XF86AudioPrev exec playerctl previous
bindsym --locked XF86AudioStop exec playerctl stop
