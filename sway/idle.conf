# ==============================================================================
# CYBER NOIR // IDLE POWER MANAGEMENT & SECURITY LOCKSCREEN (swayidle + swaylock)
# ==============================================================================
# Automatically manages screen brightness dimming, user inactivity lock screen, 
# and power saving DPMS monitor standby states without interrupting workflows.
# ==============================================================================

# The swayidle command is nested quotes three deep and sway's config lexer
# mangles it, so it lives in a script that only bash ever parses. The script
# also handles its own restart -- a separate `exec_always killall` directive
# races the start, because sway spawns every exec asynchronously.
#
# Tier 1 (300s): lock the session (scripts/lock.sh -- blurred desktop over the
#                sharp wallpaper)
# Tier 2 (360s): blank the outputs via DPMS, restoring them on input
# Tier 3 (900s): suspend, but ONLY on battery (scripts/idle-suspend.sh). The
#                chain previously stopped at tier 2, so an unplugged machine
#                blanked its screen and then stayed fully awake until flat --
#                which looks exactly like sleep, so it went unnoticed. It is
#                gated on being unplugged because swayidle measures input
#                idleness, not work: a long build involves no keystrokes.
# before-sleep : lock before any ACPI suspend/hibernate
exec_always ~/.config/sway/scripts/idle-daemon.sh
