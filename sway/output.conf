# ==============================================================================
# CYBER NOIR // DISPLAY MONITOR ARCHITECTURE & OUTPUT SETUP
# ==============================================================================
# Governs wallpaper raster display via swaybg and high-refresh Rate / VRR tuning.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. WALLPAPER
# ------------------------------------------------------------------------------
# Deliberately NOT set here. The wallpaper is owned end-to-end by
# ~/.config/sway/scripts/wallpaper_rotator.sh, which is the only process that
# talks to swaybg. Its state lives in
# ${XDG_STATE_HOME:-~/.local/state}/cyber-studio/wallpaper.state
#
# Adding an `output * bg` line back here would create a second owner and
# reintroduce the flicker/clobber the daemon exists to prevent.
# Change wallpapers with Super+Shift+W (menu) or Super+Alt+W (next).

# ------------------------------------------------------------------------------
# 2. ADAPTIVE SYNC & HIGH REFRESH RATE (VRR / FreeSync / G-Sync)
# ------------------------------------------------------------------------------
# Enable dynamic Variable Refresh Rate globally on supported high-end gaming/dev monitors
# output * adaptive_sync on
# output * render_bit_depth 10

# ------------------------------------------------------------------------------
# 3. CUSTOM MONITOR GEOMETRY (Examples for DevOps Dual/Triple Rig Setup)
# ------------------------------------------------------------------------------
# To configure specific primary and supplementary display positioning, identify
# monitor names via `swaymsg -t get_outputs` and uncomment the syntax below:
#
# Primary 4K Monitor (Scaled 1.5x for Retina crispness)
# output DP-1 resolution 3840x2160@144Hz position 0,0 scale 1.5
#
# Secondary Portrait Coding Monitor (Rotated 90 deg counterclockwise)
# output HDMI-A-1 resolution 2560x1440@120Hz position 2560,0 transform 270
