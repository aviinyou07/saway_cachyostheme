# ==============================================================================
# CYBER NOIR // INPUT DEVICE ARCHITECTURE & ERGONOMIC OPTIMIZATION
# ==============================================================================
# Configures high-response keyboard mechanics, pointer precision, and trackpads.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. KEYBOARD OPTIMIZATION & REPEAT SPEED
# ------------------------------------------------------------------------------
# Target all connected keyboard controllers with rapid typist latency
input "type:keyboard" {
    xkb_layout us
    xkb_variant ""
    
    # Ultra-responsive typist repeat timings (250ms delay, 50 chars/second)
    repeat_delay 250
    repeat_rate 50

    # Optional: Swap Caps Lock to Escape (uncomment for hardcore Vim engineering)
    # xkb_options caps:escape
    
    # Enable Numlock automatically upon login
    xkb_numlock enabled
}

# ------------------------------------------------------------------------------
# 2. TOUCHPAD & TRACKPAD MECHANICS
# ------------------------------------------------------------------------------
# Precision trackpad ergonomics with natural scrolling & touch tapping enabled
input "type:touchpad" {
    dwt enabled               # Disable trackpad tracking while typing on keyboard
    tap enabled               # Tap to click
    natural_scroll enabled    # Reverse scroll direction (Apple / Modern design)
    middle_emulation enabled  # Three-finger tap triggers middle mouse click
    click_method button_areas # Bottom right quadrant equates to right-click
    accel_profile adaptive    # Smooth pointer dynamic acceleration curve
    pointer_accel 0.35        # Responsive sensitivity multiplier
}

# ------------------------------------------------------------------------------
# 3. HIGH-PRECISION OPTICAL / WIRELESS MICE
# ------------------------------------------------------------------------------
input "type:pointer" {
    accel_profile flat        # Flat raw input acceleration for extreme precision
    pointer_accel 0.0
}
