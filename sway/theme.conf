# ==============================================================================
# CYBER STUDIO THEME // DESIGN TOKENS & WINDOW DECORATION
# ==============================================================================
# Values here mirror ../PALETTE.md. Do not introduce a hex that is not in that
# table -- the whole point of this file is that one ramp drives every surface.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. TYPOGRAPHY
# ------------------------------------------------------------------------------
# Canonical fontconfig family name is "JetBrainsMono Nerd Font" (no space between
# JetBrains and Mono). The spaced spelling only works via fuzzy substitution.
font pango:JetBrainsMono Nerd Font 10

# ------------------------------------------------------------------------------
# 2. DESIGN TOKENS  (see ../PALETTE.md)
# ------------------------------------------------------------------------------
set $bg        #090C14
set $surface   #0F172A
set $card      #111827
set $border    #1E293B
set $accent    #38BDF8
set $ok        #22C55E
set $alt       #A78BFA
set $info      #2DD4BF
set $warn      #FBBF24
set $err       #EF4444
set $text      #F8FAFC
set $text_2    #CBD5E1
set $text_3    #64748B
set $text_4    #475569

# ------------------------------------------------------------------------------
# 3. WINDOW DECORATION & STATE MAPPING
# ------------------------------------------------------------------------------
# The focused border is $accent so that window focus and the active workspace
# indicator in waybar read as the same signal. It was previously neon green
# against a sky-blue bar, which is what made the desktop look mismatched.
#
# Syntax: class            border    background  text      indicator  child_border
client.focused             $accent   $surface    $text     $accent    $accent
client.focused_inactive    $border   $bg         $text_3   $border    $border
client.unfocused           $card     $bg         $text_4   $card      $card
client.urgent              $err      $err        $text     $warn      $err
client.placeholder         $card     $bg         $text_3   $card      $card
client.background          $bg
