# ==============================================================================
# CYBER NOIR // NOTIFICATION DAEMON ARCHITECTURE (Mako Integration)
# ==============================================================================
# Manages system alerting, GitHub notification popups, and Mako daemons.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NOTIFICATION DAEMON LIFECYCLE
# ------------------------------------------------------------------------------
# Re-initialize Mako. Kill and start must share one shell -- as two separate
# exec_always directives the kill races the start and mako ends up dead after
# every `swaymsg reload`. See the same note in idle.conf.
exec_always sh -c 'pkill -x mako; sleep 0.3; exec mako --config ~/.config/mako/config'

# ------------------------------------------------------------------------------
# 2. KEYBOARD INTERACTIVES & NOTIFICATION CONTROL
# ------------------------------------------------------------------------------
# Dismiss currently focused top notification bubble
bindsym $mod+n exec makoctl dismiss

# Dismiss entire historical queue of active visible notifications simultaneously
bindsym $mod+Shift+n exec makoctl dismiss -a

# Restore last dismissed notification back to active screen view
bindsym $mod+Ctrl+n exec makoctl restore

# Toggle Do-Not-Disturb (DND) suppressive mode for deep DevOps focus hours
bindsym $mod+m exec makoctl mode -s dnd && notify-send -t 1500 "Mako DND Mode Enabled // Focus Active" || exec makoctl mode -r dnd
