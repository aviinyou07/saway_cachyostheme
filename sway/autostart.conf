# ==============================================================================
# CYBER NOIR // AUTOSTART DAEMONS & SYSTEM INITIALIZATION
# ==============================================================================
# Orchestrates desktop components, status bars, daemons, and systemd user services.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. STATUS BAR ARCHITECTURE (Waybar)
# ------------------------------------------------------------------------------
# Terminate stray status bar processes and launch Waybar with Cyber Noir styles
exec_always sh -c 'killall -q waybar; sleep 0.2; waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css'

# ------------------------------------------------------------------------------
# 2. CLIPBOARD INTEGRATION (wl-clipboard + cliphist)
# ------------------------------------------------------------------------------
# Listen to both regular text selection and image buffers, caching history
exec_always sh -c 'killall -q wl-paste; sleep 0.2; wl-paste --type text --watch cliphist store & wl-paste --type image --watch cliphist store &'

# Ergonomic launcher shortcut to display and paste clipboard items via Wofi
# The $mod+y binding that used to sit here now lives with every other binding
# in bindings.conf. A keybinding declared in the autostart file is invisible to
# anyone reading the bindings, and this one silently duplicated $mod+Shift+v.

# ------------------------------------------------------------------------------
# 3. AUTHENTICATION & SECURITY POLKIT DAEMONS
# ------------------------------------------------------------------------------
# Auto-detect and initialize standard CachyOS / Arch Linux Polkit agent
exec /usr/lib/polkit-kde-authentication-agent-1 || /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1 || /usr/lib/mate-polkit/polkit-mate-authentication-agent-1 || true

# ------------------------------------------------------------------------------
# 4. SYSTEMD USER INTEGRATION & XDG DESKTOP PORTAL WAYLAND
# ------------------------------------------------------------------------------
# Synchronize environment variables with systemd user session & DBus for screen sharing
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP=sway SWAYSOCK
exec systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP SWAYSOCK

# Start the portals ONCE, after the environment has been exported. This used to
# be an `exec_always` that killed every portal on each `swaymsg reload` -- which
# tears down any in-flight screen share and briefly breaks file dialogs.
# Backend preference is pinned in ~/.config/xdg-desktop-portal/sway-portals.conf.
exec sh -c 'sleep 1; systemctl --user start xdg-desktop-portal-wlr xdg-desktop-portal || true'

# ------------------------------------------------------------------------------
# 5. GTK, ICON & CURSOR THEME SYNC
# ------------------------------------------------------------------------------
# Delegated to a script because sway has no conditionals: the cursor theme must
# be resolved against what is actually installed, or a fresh install ends up
# with no cursor at all. The script also keeps gtk-3.0/gtk-4.0 settings.ini in
# sync, which is what GTK3 dialogs on Wayland actually read.
exec_always ~/.config/sway/scripts/desktop-theme.sh

# Conservative fallback so a cursor exists even before the script has run.
seat seat0 xcursor_theme "Adwaita" 24

# ------------------------------------------------------------------------------
# 6. WALLPAPER ENGINE
# ------------------------------------------------------------------------------
# Single owner of swaybg. Handles both the static wallpaper and, when enabled,
# timed rotation. exec_always + an internal lock makes reloads idempotent.
exec_always ~/.config/sway/scripts/wallpaper_rotator.sh

# ------------------------------------------------------------------------------
# LOCK SCREEN CACHE PRE-WARM
# ------------------------------------------------------------------------------
# Builds the lock screen's cached wallpaper base and vignette up front. Without
# it the first lock of the session pays ~1.8s to decode the wallpaper and build
# the gradient -- and it pays it with the desktop still on screen, which is the
# one moment that latency actually matters. Runs after the rotator so it warms
# whichever wallpaper that just selected.
exec sh -c 'sleep 3; ~/.config/sway/scripts/lock.sh --prewarm'

# ------------------------------------------------------------------------------
# RESIDENT GTK APPS
# ------------------------------------------------------------------------------
# Started hidden, once, so opening them later is a D-Bus wake instead of a fresh
# Python + GTK startup. That floor is ~1.45s here, measured with an empty window;
# waking a resident app is 27ms for the clipboard and ~200ms for networks (which
# also refreshes its scan on the way up). See scripts/open-app.sh.
# No pkill here. A second --daemon launch simply activates the running instance
# and exits, so this is already idempotent -- and `pkill -f` would match any
# process whose command line merely contains the pattern, including the shell
# that ran it.
exec_always ~/.config/sway/scripts/clipboard-gui.py --daemon
exec_always ~/.config/sway/scripts/network-gui.py --daemon

