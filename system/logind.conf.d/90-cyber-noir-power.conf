# ==============================================================================
# CYBER NOIR // POWER & SLEEP KEY HANDLING
# ==============================================================================
# Installed to /etc/systemd/logind.conf.d/90-cyber-noir-power.conf
#
# Without this file the power button shuts the machine down INSTANTLY and
# without any prompt. That is not a sway behaviour -- it is systemd-logind's
# default (HandlePowerKey=poweroff) taking the keypress because the compositor
# never bound it.
#
# `ignore` makes logind pass the key through to the compositor, where
# ~/.config/sway/bindings.conf (section 6b) opens the power menu instead.
# The long-press stays wired to a real poweroff so a wedged session can always
# be killed by holding the button for ~5 seconds (systemd's long-press threshold).
# ==============================================================================
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff

# The sleep key is bound in sway as well; let the compositor own it.
HandleSuspendKey=ignore
HandleHibernateKey=ignore

# Lid behaviour stays with logind -- it still fires when sway is not running.
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=ignore
