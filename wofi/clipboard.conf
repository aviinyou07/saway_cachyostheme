# ==============================================================================
# CYBER NOIR // WOFI PROFILE: CLIPBOARD PICKER
# ==============================================================================
# Separate from dmenu.conf (power menu) because the two have opposite needs: the
# power menu is five short labels in a small box, this is a long list of wide
# text that has to stay readable.
#
# cliphist truncates each preview to 100 characters, so rows never need to wrap
# -- GTK labels cannot be ellipsized from wofi's stylesheet, so the width below
# is chosen to fit that preview instead.
# ==============================================================================

mode=dmenu

# --- Geometry -----------------------------------------------------------------
location=center
orientation=vertical
halign=fill
content_halign=left
width=920
height=600
# lines= is deliberately UNSET. It overrides `height`, and wofi derives a line's
# height from font metrics rather than from the stylesheet -- so with the taller
# rows in clipboard.css the window came out far too short and clipped its
# content. With few entries in the store it collapsed to the search bar plus a
# sliver of one row. A pixel height is predictable at any entry count.

# --- Behaviour ----------------------------------------------------------------
# One click activates. wofi's default is a double click, which on a clipboard
# picker feels broken rather than deliberate.
single_click=true

insensitive=true
matching=fuzzy
sort_order=default
filter_rate=50
layer=overlay
gtk_dark=true

# Only ever return one of the rows offered -- never the raw search text.
no_custom_entry=true

# Images ON: this history is overwhelmingly screenshots, and as plain text every
# one of them renders as an identical "[[ binary data 2 MiB png 1920x1080 ]]"
# row -- literally impossible to tell apart. clipboard.sh decodes the newest few
# into cached thumbnails and hands them over as `img:PATH:text:LABEL`.
#
# The tradeoff: with images on, a TEXT entry that happens to begin with "img:"
# is parsed as an image reference. wofi simply fails to load it and shows the
# text, so the worst case is one cosmetically odd row, never code execution.
allow_images=true
image_size=44

# Markup stays OFF. Clipboard contents are arbitrary, and pango markup in a
# copied string must never be able to restyle or restructure the menu.
allow_markup=false
