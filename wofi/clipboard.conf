# ==============================================================================
# CYBER NOIR // WOFI PROFILE: CLIPBOARD PICKER
# ==============================================================================
# Separate from dmenu.conf (power menu) because the two have opposite needs: the
# power menu is five short labels in a small box, this is a long list of wide
# text that has to stay readable.
#
# cliphist truncates each preview to 100 characters, so rows never need to wrap
# -- GTK labels cannot be ellipsized from wofi's stylesheet, so the width below
# is chosen to fit that preview instead.
# ==============================================================================

mode=dmenu

# --- Geometry -----------------------------------------------------------------
location=center
orientation=vertical
halign=fill
content_halign=left
width=920
height=600
lines=12

# --- Behaviour ----------------------------------------------------------------
# One click activates. wofi's default is a double click, which on a clipboard
# picker feels broken rather than deliberate.
single_click=true

insensitive=true
matching=fuzzy
sort_order=default
filter_rate=50
layer=overlay
gtk_dark=true

# Only ever return one of the rows offered -- never the raw search text.
no_custom_entry=true

# Clipboard contents are arbitrary user data. Both escape parsers stay off so a
# copied string containing markup or an image path cannot alter the menu.
allow_images=false
allow_markup=false
