# ==============================================================================
# CYBER NOIR // WOFI dmenu PROFILE (power menu, clipboard, pickers)
# ==============================================================================
# Deliberately SEPARATE from ~/.config/wofi/config.
#
# The launcher config is a drun profile: it sets `show=drun`, `allow_images` and
# `allow_markup`. Passing that file to a `--dmenu` invocation mixes a mode
# declaration and image/markup escape parsing into a menu whose entries are
# plain text -- fragile, and it made the power menu's failure hard to read.
#
# This profile declares dmenu mode explicitly and turns the escape parsing off,
# so what a script writes on stdin is exactly what it reads back on stdout.
# ==============================================================================

mode=dmenu

# --- Geometry -----------------------------------------------------------------
location=center
orientation=vertical
halign=fill
content_halign=left

# --- Behaviour ----------------------------------------------------------------
# Activate on one click. wofi's default is a DOUBLE click, which is what made
# the Waybar power menu look completely dead.
single_click=true

insensitive=true
matching=fuzzy
sort_order=default
filter_rate=50
layer=overlay
gtk_dark=true

# Never offer the raw contents of the search box as a result -- a power menu
# must only ever return one of the entries it was given.
no_custom_entry=true

# Entries here are plain text. Leave both escape parsers off so the string that
# comes back on stdout is byte-identical to the one written on stdin.
allow_images=false
allow_markup=false
