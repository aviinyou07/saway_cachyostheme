[dmenu]
# Must carry --conf/--style, or the network picker is the only wofi surface
# in the theme that renders in default GTK grey.
dmenu_command = wofi --dmenu --conf ~/.config/wofi/config --style ~/.config/wofi/style.css
active_chars = ==
compact = True
pinentry = pinentry-gnome3
wifi_chars = ▂▄▆█

[editor]
terminal = kitty
gui_if_available = True
