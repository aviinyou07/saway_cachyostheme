[dmenu]
# FALLBACK ONLY. sway/scripts/network-gui.py is what the bar and keybindings
# use now; this remains for when python-gobject/gtk4 break on an update.
#
# Points at dmenu.conf, NOT wofi/config. The latter is the drun launcher
# profile: it declares `show=drun` and turns on image and pango-markup parsing,
# all of which were being mixed into a --dmenu invocation here -- the same
# mistake that made the power menu unreadable. An SSID is arbitrary text and
# must never be parsed as markup.
dmenu_command = wofi --dmenu --conf ~/.config/wofi/dmenu.conf --style ~/.config/wofi/style.css
active_chars = ==
compact = True
pinentry = pinentry-gnome3
wifi_chars = ▂▄▆█

[editor]
terminal = kitty
gui_if_available = True
