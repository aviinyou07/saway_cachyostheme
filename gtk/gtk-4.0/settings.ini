# ==============================================================================
# CYBER STUDIO // GTK4 / libadwaita
# ==============================================================================
# GTK4 reads this file directly. Relying on gsettings alone leaves
# floating GTK dialogs -- pavucontrol, blueman, nm-connection-editor, the file
# chooser -- rendering in the light default theme, which is the single most
# visible theming gap on a sway desktop.
#
# sway/scripts/desktop-theme.sh rewrites the three *-name keys at login to
# whatever is actually installed, so a missing theme degrades instead of
# silently falling back to light.
# ==============================================================================
[Settings]
gtk-theme-name=catppuccin-mocha-blue-standard+default
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=JetBrainsMono Nerd Font 10
gtk-application-prefer-dark-theme=1
gtk-enable-animations=1
gtk-primary-button-warps-slider=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
gtk-decoration-layout=:menu
