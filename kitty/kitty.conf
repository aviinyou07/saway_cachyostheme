# ==============================================================================
# CYBER STUDIO WORKSTATION // KITTY TERMINAL MAIN CONFIGURATION
# ==============================================================================
# Engineered for production Linux DevOps engineering & ultra-low latency typing.
# Strict visual aesthetic: JetBrains Mono, 0.92 glassmorphic alpha, smooth padding,
# and zero visual clutter.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. COLOR THEME & PALETTE INCLUSION
# ------------------------------------------------------------------------------
# Colour tokens live in one file, mirrored from ../PALETTE.md
include cyber_studio.conf

# ------------------------------------------------------------------------------
# 2. TYPOGRAPHY & FONT ENGINEERING
# ------------------------------------------------------------------------------
# Primary mono font rendering hierarchy with full Nerd Font icon ligature coverage
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_size 11.5
force_ltr no
modify_font cell_height 2px
modify_font cell_width 100%

# Enable ligatures (code symbols == != >= =>) and optimize subpixel rendering
disable_ligatures never

# ------------------------------------------------------------------------------
# 3. TRANSPARENCY & COMPANION WINDOW GEOMETRY
# ------------------------------------------------------------------------------
# Transparent background for Sway Wayland glassmorphism
background_opacity 0.75
dynamic_background_opacity yes
confirm_os_window_close 0

# Internal spatial padding around terminal grid (top, right, bottom, left)
window_padding_width 14 16 14 16

# Minimal window borders
draw_minimal_borders yes
window_border_width 1px
hide_window_decorations yes
single_window_margin_width -1

# ------------------------------------------------------------------------------
# 4. CURSOR MECHANICS & SCROLLBACK MEMORY
# ------------------------------------------------------------------------------
# Responsive green blinking block cursor with smooth decay animation
cursor_shape block
cursor_blink_interval -1
cursor_stop_blinking_after 15.0
cursor_beam_thickness 1.5

# High-capacity scrollback buffer for inspecting DevOps logs, docker & kubectl dumps
scrollback_lines 15000
scrollback_pager less --chord --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 2.0

# ------------------------------------------------------------------------------
# 5. MOUSE INTERACTIVES & URL HYPERLINKS
# ------------------------------------------------------------------------------
# Interactive cyber cyan URLs with curly styling upon hover
url_style curly
open_url_with default
url_prefixes http https file ftp git ssh docker
detect_urls yes

# Automatically copy selected text to Wayland clipboard buffer
copy_on_select yes
strip_trailing_spaces smart

# ------------------------------------------------------------------------------
# 6. AUDIO BELL SUPPRESSION & SYSTEM ALERTING
# ------------------------------------------------------------------------------
# Total suppression of acoustic terminal bells during intensive CLI debugging
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab no

# ------------------------------------------------------------------------------
# 7. TAB BAR STYLING & MULTIPLEXER LAYOUTS
# ------------------------------------------------------------------------------
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_activity_symbol 
tab_title_template "{index}: {title}{' []' if layout_name == 'stack' else ''}"
active_tab_font_style   bold
inactive_tab_font_style normal
enabled_layouts splits,stack,tall,fat,grid

# ------------------------------------------------------------------------------
# 8. ERGONOMIC DEVOPS SHORTCUTS & KEYBINDINGS
# ------------------------------------------------------------------------------
# Clear default bindings to enforce predictable engineering workflows
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_selection

# Fast font size scaling on the fly during code presentations & debugging
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0     change_font_size all 0

# Window management & quick terminal splits
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+n     new_os_window
map ctrl+shift+w     close_window
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

# Tab bar navigation
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+q close_tab

# Jump directly into interactive scrollback buffer search.
# NOTE: deliberately NOT ctrl+shift+h -- that is previous_tab above, and kitty
# silently lets the last duplicate win, which killed tab navigation.
map ctrl+shift+f show_scrollback
