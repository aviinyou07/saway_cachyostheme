# ==============================================================================
# CYBER NOIR // REPOSITORY CHECKS
# ==============================================================================
# Every check here exists because the corresponding mistake actually shipped:
#
#   * an unterminated single quote in sway/autostart.conf, which silently broke
#     the line it was on
#   * a trailing-comma / malformed edit to waybar/config.jsonc, which would stop
#     the entire bar from starting
#   * install.sh referencing a file that no longer existed in the repo
#   * a package used by a shipped script but missing from CORE_PKGS, so a fresh
#     install silently lost the feature
#
# None of them are subtle once looked for, and none were caught by hand.
name: checks

on:
  push:
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          fail=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(find . -name '*.sh' -not -path './.git/*')
          exit $fail

      - name: Python syntax
        run: |
          fail=0
          while IFS= read -r f; do
            python3 -m py_compile "$f" || { echo "::error file=$f::py_compile failed"; fail=1; }
          done < <(find . -name '*.py' -not -path './.git/*')
          exit $fail

      - name: Executable bit on shipped scripts
        run: |
          fail=0
          while IFS= read -r f; do
            [ -x "$f" ] || { echo "::error file=$f::not executable"; fail=1; }
          done < <(find sway/scripts waybar/scripts -name '*.sh' -o -path 'sway/scripts/*' -name '*.py')
          exit $fail

      - name: waybar config is valid JSON
        run: |
          python3 - <<'PY'
          import json, re, sys
          src = open('waybar/config.jsonc', encoding='utf-8').read()
          src = re.sub(r'//.*', '', src)
          src = re.sub(r',(\s*[}\]])', r'\1', src)
          cfg = json.loads(src)
          placed = [m for k in ('modules-left','modules-center','modules-right') for m in cfg.get(k, [])]
          missing = [m for m in placed if m.startswith('custom/') and m not in cfg]
          if missing:
              print('::error::custom modules placed with no config block: %s' % ', '.join(missing))
              sys.exit(1)
          print('waybar config OK — %d modules' % len(placed))
          PY

      - name: sway config quoting
        run: |
          fail=0
          while IFS= read -r f; do
            # An odd number of single quotes on an exec line means one is unclosed.
            awk -v F="$f" '
              /^[[:space:]]*(exec|exec_always|bindsym)/ {
                n = gsub(/'"'"'/, "'"'"'")
                if (n % 2) { printf "::error file=%s,line=%d::unbalanced quote\n", F, NR; bad=1 }
              }
              END { exit bad }
            ' "$f" || fail=1
          done < <(find sway -name '*.conf' -o -name 'config')
          exit $fail

      - name: install.sh references files that exist
        run: |
          fail=0
          grep -oE '\$\{SCRIPT_DIR\}/[A-Za-z0-9._/-]+' install.sh | sed 's|${SCRIPT_DIR}/||' | sort -u |
          while IFS= read -r f; do
            [ -e "$f" ] || { echo "::error file=install.sh::missing referenced path: $f"; exit 1; }
          done
          exit $fail

      - name: every command a script runs is in CORE_PKGS
        run: |
          # Commands deliberately treated as always-present (coreutils/bash builtins)
          BASE='awk|basename|cat|chmod|cp|cut|date|dirname|echo|find|grep|head|kill|ln|ls|mkdir|mv|printf|pkill|pgrep|read|rm|sed|seq|sleep|sort|stat|tail|tee|test|tr|uname|wc|xargs|sudo|systemctl|bash|sh|python3|git|tput|numfmt|shred|rmdir|flock|setsid|killall|nproc|cmp|diff'
          MISSING=""
          for c in grim slurp jq magick wtype cliphist wl-copy wl-paste playerctl swaylock swayidle swaybg swaymsg wofi waybar mako notify-send gsettings sensors checkupdates nmcli rfkill bluetoothctl brightnessctl ping; do
            echo "$c" | grep -qE "^($BASE)$" && continue
            grep -rqE "\b$c\b" --include='*.sh' --include='*.conf' --include='*.py' . || continue
            grep -q "\"$(echo "$c" | sed 's/magick/imagemagick/;s/notify-send/libnotify/;s/gsettings/glib2/;s/sensors/lm_sensors/;s/checkupdates/pacman-contrib/;s/nmcli/networkmanager/;s/rfkill/util-linux/;s/bluetoothctl/bluez-utils/;s/wl-copy/wl-clipboard/;s/wl-paste/wl-clipboard/;s/ping/iputils/')\"" install.sh \
              || MISSING="$MISSING $c"
          done
          if [ -n "$MISSING" ]; then echo "::warning::commands used but possibly not in CORE_PKGS:$MISSING"; fi
