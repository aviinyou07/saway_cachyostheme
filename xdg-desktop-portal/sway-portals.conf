# ==============================================================================
# CYBER STUDIO // XDG DESKTOP PORTAL BACKENDS FOR SWAY
# ==============================================================================
# Without this file, backend selection is arbitrary whenever more than one
# portal implementation is installed (this system has -wlr, -gtk AND -cosmic),
# which is the usual cause of "screen sharing picks the wrong thing" or
# "the file dialog never appears" under sway.
#
# wlr  -> screencast/screenshot (the only one that speaks wlroots)
# gtk  -> everything with a UI: file chooser, app chooser, settings, print
# ==============================================================================
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
